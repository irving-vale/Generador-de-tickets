name: Validacion de Codigo Base

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar, Probar y Analizar con Sonar
        run: >
          mvn clean verify sonar:sonar 
          -Dtest=!CursoSpringBootApplicationTests 
          -Dsonar.host.url=https://sonarcloud.io 
          -Dsonar.organization=irving-vale
          -Dsonar.projectKey=Generador-de-tickets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

