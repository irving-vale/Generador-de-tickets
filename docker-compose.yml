  version: '3.8'

  services:

    db:
      image: postgres:15.2
      container_name: best_travel
      restart: always
      volumes:
        - ./db/sql/create_schema.sql:/docker-entrypoint-initdb.d/create_schema.sql
        - ./db/sql/data.sql:/docker-entrypoint-initdb.d/data.sql
      environment:
        - POSTGRES_DB=best_travel
        - POSTGRES_USER=alejandro
        - POSTGRES_PASSWORD=debuggeandoideas
      ports:
        - "5432:5432"

    app:
      build: .
      container_name: sprinboot_dev
      ports:
        - "8080:8080"
      volumes:
        - ./:/app:Z
        - ~/.m2:/root/.m2:Z
      entrypoint: ["/bin/bash", "-c", "chmod +x mvnw && ./mvnw spring-boot:run"]
      environment:
        - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/best_travel
        - SPRING_DATASOURCE_USERNAME=alejandro
        - SPRING_DATASOURCE_PASSWORD=debuggeandoideas
      depends_on:
        - db
